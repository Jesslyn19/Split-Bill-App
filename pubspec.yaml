name: split_bill_app
description: "A smart bill splitting app with receipt scanning and fair item distribution."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # AI & Receipt Scanning
  google_generative_ai: ^0.4.6
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # Utilities & UI
  intl: ^0.19.0
  share_plus: ^10.0.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
